---
name: "Nitro Enclaves EIF build"
description: |
  Builds a reproducible AWS Nitro Enclaves EIF from a Dockerfile using a custom
  kernel (bzImage, cmdline, init, linuxkit, nsm.ko). Outputs the EIF file, its
  describe-eif JSON, PCR0-2 and the EIF sha256.
branding:
  icon: "package"
  color: "blue"

inputs:
  context:
    description: "Docker build context directory, relative to the repository root"
    required: true
  dockerfile:
    description: "Dockerfile path, relative to the build context"
    required: false
    default: Dockerfile
  kernel-blobs:
    description: "Directory with bzImage, cmdline, init, linuxkit and nsm.ko, relative to the repository root"
    required: true
  build-args:
    description: "Docker build args, one KEY=VALUE per line"
    required: false
    default: ""
  eif-name:
    description: "File name of the produced EIF"
    required: false
    default: enclave.eif

outputs:
  eif-path:
    description: "Path of the built EIF file"
    value: ${{ steps.build.outputs.eif-path }}
  info-path:
    description: "Path of the describe-eif JSON"
    value: ${{ steps.build.outputs.info-path }}
  eif-sha256:
    description: "sha256 of the EIF file"
    value: ${{ steps.build.outputs.eif-sha256 }}
  pcr0:
    description: "PCR0 measurement"
    value: ${{ steps.build.outputs.pcr0 }}
  pcr1:
    description: "PCR1 measurement"
    value: ${{ steps.build.outputs.pcr1 }}
  pcr2:
    description: "PCR2 measurement"
    value: ${{ steps.build.outputs.pcr2 }}

runs:
  using: "composite"
  steps:
    - name: Check runner
      if: ${{ runner.os != 'Linux' || runner.arch != 'X64' }}
      shell: bash
      run: |
        echo "::error::This action supports Linux X64 runners only"
        exit 1

    - name: Build EIF
      id: build
      shell: bash
      env:
        CONTEXT: ${{ inputs.context }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        KERNEL_BLOBS: ${{ inputs.kernel-blobs }}
        BUILD_ARGS: ${{ inputs.build-args }}
        EIF_NAME: ${{ inputs.eif-name }}
        OUTPUT_DIR: ${{ runner.temp }}/eif-output
      run: |
        "${GITHUB_ACTION_PATH}/scripts/build-eif.sh"

        EIF="${OUTPUT_DIR}/${EIF_NAME}"
        INFO="${OUTPUT_DIR}/${EIF_NAME%.eif}-info.json"
        {
          echo "eif-path=${EIF}"
          echo "info-path=${INFO}"
          echo "eif-sha256=$(sha256sum "${EIF}" | cut -d' ' -f1)"
          echo "pcr0=$(jq -r .Measurements.PCR0 "${INFO}")"
          echo "pcr1=$(jq -r .Measurements.PCR1 "${INFO}")"
          echo "pcr2=$(jq -r .Measurements.PCR2 "${INFO}")"
        } >> "${GITHUB_OUTPUT}"
